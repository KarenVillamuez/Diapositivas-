<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190306"/>
      <stop offset="100%" stop-color="#2D060D"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1113"/>
      <stop offset="100%" stop-color="#3D060A"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECE4E5"/>
      <stop offset="90%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0D4D6"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0D4D6"/>
      <stop offset="10%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE4E5"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C21B"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Fondo Minimalista -->
  <rect width="600" height="400" fill="url(#bookBg)"/>

  <!-- Sombra Suave del Libro -->
  <ellipse cx="300" cy="320" rx="230" ry="26" fill="rgba(0,0,0,0.6)"/>

  <!-- Tapa Dura del Libro Abierto -->
  <path d="M 65 285 Q 300 310 535 285 L 542 90 Q 300 115 58 90 Z" fill="url(#coverGrad)" stroke="#110103" stroke-width="2.5"/>

  <!-- Páginas Izquierdas (Bloque Curvo) -->
  <path d="M 72 276 Q 295 296 295 100 L 80 84 Z" fill="url(#pageLeft)"/>
  <!-- Páginas Derechas (Bloque Curvo) -->
  <path d="M 528 276 Q 305 296 305 100 L 520 84 Z" fill="url(#pageRight)"/>

  <!-- Lomo y Costura Central -->
  <line x1="300" y1="96" x2="300" y2="300" stroke="#7B1113" stroke-width="4"/>

  <!-- Cinta Marcapáginas de Raso Dorado -->
  <path d="M 300 96 Q 306 200 320 318 L 332 306 L 344 318 Q 314 200 300 96 Z" fill="url(#goldRibbon)"/>

  <!-- Composición Visual Página Izquierda: Líneas Editoriales Limpias y Elegantes -->
  <g transform="translate(105, 115)">
    <!-- Letra Capital / Emblema Curricular Dorado -->
    <rect x="0" y="4" width="46" height="46" rx="4" fill="#7B1113" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="23" y="36" font-family="'Inter', sans-serif" font-size="30" font-weight="900" fill="#D4AF37" text-anchor="middle">§</text>
    
    <!-- Encabezado de Capítulo Simulado -->
    <rect x="58" y="10" width="105" height="12" rx="2" fill="#7B1113" opacity="0.9"/>
    <rect x="58" y="28" width="75" height="8" rx="2" fill="#C51625" opacity="0.6"/>

    <!-- Separador Fino -->
    <line x1="0" y1="64" x2="165" y2="64" stroke="#7B1113" stroke-width="1.5" opacity="0.3"/>

    <!-- Párrafos Estilizados Limpios (Sin texto diminuto ilegible) -->
    <rect x="0" y="80" width="165" height="6" rx="3" fill="#8D7A7D" opacity="0.35"/>
    <rect x="0" y="96" width="150" height="6" rx="3" fill="#8D7A7D" opacity="0.35"/>
    <rect x="0" y="112" width="160" height="6" rx="3" fill="#8D7A7D" opacity="0.35"/>
    <rect x="0" y="128" width="135" height="6" rx="3" fill="#8D7A7D" opacity="0.35"/>
    <rect x="0" y="144" width="155" height="6" rx="3" fill="#8D7A7D" opacity="0.35"/>
  </g>

  <!-- Composición Visual Página Derecha: Líneas Editoriales Limpias -->
  <g transform="translate(330, 115)">
    <!-- Encabezado Limpio -->
    <rect x="0" y="10" width="120" height="12" rx="2" fill="#7B1113" opacity="0.9"/>
    <rect x="0" y="28" width="85" height="8" rx="2" fill="#D4AF37" opacity="0.75"/>

    <!-- Separador Fino -->
    <line x1="0" y1="64" x2="165" y2="64" stroke="#C51625" stroke-width="1.5" opacity="0.3"/>

    <!-- Párrafos Estilizados Limpios -->
    <rect x="0" y="80" width="165" height="6" rx="3" fill="#8D7A7D" opacity="0.35"/>
    <rect x="0" y="96" width="155" height="6" rx="3" fill="#8D7A7D" opacity="0.35"/>
    
    <!-- Bloque Destacado de Regla Gramatical / Corpus RAG -->
    <rect x="0" y="114" width="165" height="38" rx="4" fill="#FAF0F2" stroke="#7B1113" stroke-width="1.5"/>
    <rect x="12" y="124" width="140" height="6" rx="3" fill="#7B1113" opacity="0.7"/>
    <rect x="12" y="136" width="95" height="6" rx="3" fill="#C51625" opacity="0.7"/>
  </g>
</svg>
