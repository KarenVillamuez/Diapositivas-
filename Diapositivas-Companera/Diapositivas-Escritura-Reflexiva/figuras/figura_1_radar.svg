<text x="1034" y="190" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#C9101B" letter-spacing="1">MODELOS SELECCIONADOS</text>
<rect x="1034" y="210" width="20" height="20" fill="#460811"/>
<text x="1064" y="226" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#2C0509">Flower y Hayes (1981)</text>
<text x="1064" y="250" font-family="Arial, sans-serif" font-size="15" fill="#5D4A4D">Proceso cognitivo cíclico: planear,</text>
<text x="1064" y="270" font-family="Arial, sans-serif" font-size="15" fill="#5D4A4D">redactar y revisar. Aporta las fases.</text>
<rect x="1034" y="298" width="20" height="20" fill="#C9101B"/>
<text x="1064" y="314" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#2C0509">Schön (1983)</text>
<text x="1064" y="338" font-family="Arial, sans-serif" font-size="15" fill="#5D4A4D">Práctica reflexiva en la acción.</text>
<text x="1064" y="358" font-family="Arial, sans-serif" font-size="15" fill="#5D4A4D">Aporta el diálogo y la sorpresa.</text>
<line x1="1034" y1="385" x2="1326" y2="385" stroke="#EAE0E1" stroke-width="1.5"/>
