<text x="1064" y="523" font-family="Arial, sans-serif" font-size="13" fill="#8D7A7D">Sobrecarga de memoria de trabajo</text>
<line x1="1034" y1="549" x2="1056" y2="549" stroke="#8C6A3E" stroke-width="3" stroke-dasharray="4,3"/>
<text x="1064" y="553" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C0509">Zimmerman y Risemberg</text>
<text x="1064" y="571" font-family="Arial, sans-serif" font-size="13" fill="#8D7A7D">Autorregulación y motivación</text>
<line x1="1034" y1="597" x2="1056" y2="597" stroke="#3B7A57" stroke-width="3" stroke-dasharray="4,3"/>
<text x="1064" y="601" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C0509">Grupo Didactext</text>
<text x="1064" y="619" font-family="Arial, sans-serif" font-size="13" fill="#8D7A7D">Didáctica sociocognitiva general</text>
<rect x="1026" y="660" width="308" height="175" fill="#FFFFFF" stroke="#B38600" stroke-width="2"/>
<rect x="1026" y="660" width="308" height="6" fill="#F5C21B"/>
<text x="1040" y="692" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#B38600">HALLAZGO DE SELECCIÓN</text>
<text x="1040" y="720" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C0509">Complementariedad Exacta:</text>
<text x="1040" y="742" font-family="Arial, sans-serif" font-size="14" fill="#5D4A4D">Ningún modelo por sí solo cubría la</text>
<text x="1040" y="762" font-family="Arial, sans-serif" font-size="14" fill="#5D4A4D">necesidad. Flower y Hayes da la división</text>
<text x="1040" y="782" font-family="Arial, sans-serif" font-size="14" fill="#5D4A4D">operativa; Schön la lógica reflexiva</text>
<text x="1040" y="802" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C9101B">que impide que la IA sustituya al autor.</text>
<text x="60" y="915" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C0509">Fig. 1. Evaluación comparativa de modelos de escritura reflexiva.</text>
<text x="600" y="915" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#8D7A7D">Figure 1. Comparative evaluation of reflective writing models. Fuente: Autores.</text>
